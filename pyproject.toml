[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiview-laplacian-refinement"
version = "0.1.0"
description = "Staged experimental framework for multi-view coarse mesh generation and Laplacian refinement."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]
gpu = [
  "moderngl>=5.8",
]
cuda = [
  "torch>=2.1",
]
train = [
  "torch>=2.1",
  "tqdm>=4.66",
]
bunny = [
  "trimesh>=4.4",
  "rtree>=1.2",
]

[project.scripts]
mlr = "mlr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
